version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"  # Changed from weekly to monthly
    open-pull-requests-limit: 5  # Reduced from 10 to 5
    groups:
      # Group all npm dependencies into a single PR
      dependencies:
        patterns:
          - "*"
    reviewers:
      - "FarhanAlam"
    assignees:
      - "FarhanAlam"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "github-actions"
      - "automated"
