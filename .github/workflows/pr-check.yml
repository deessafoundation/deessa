name: Pull Request Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run Linter
        run: pnpm run lint
        continue-on-error: true
      
      - name: Build Project
        run: echo "Skipping build - Vercel will handle it"
      
      - name: Run Tests
        run: pnpm run test
        continue-on-error: true
