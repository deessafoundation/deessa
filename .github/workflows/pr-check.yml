name: Pull Request Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Linter
        run: npm run lint
        continue-on-error: true
      
      - name: Build Project
        run: npm run build
      
      - name: Run Tests
        run: npm run test
        continue-on-error: true
