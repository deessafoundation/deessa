<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720" preserveAspectRatio="none" role="presentation">
  <!--
    Soft watercolour wash panel for the podcast "Meet the hosts" section.

    Recipe (from user spec):
      - Organic blob path for shape
      - feTurbulence + feDisplacementMap for wobbly organic edge
      - Small feGaussianBlur (3px) for soft feathered dissolution into white
      - Radial gradient: lighter center (#DCEEFA), deeper edges (#BFDFF4)
      - Faint dry-brush bristle streaks at outer edges only (left + bottom)
      - Subtle paper-grain texture overlay
      - NO hard white horizontal streak lines through the fill
      - Semi-transparent so content on top stays readable
  -->
  <defs>
    <!-- Pigment pooling: lighter center, slightly deeper/more saturated edges -->
    <radialGradient id="wash" cx="50%" cy="48%" rx="52%" ry="50%">
      <stop offset="0%" stop-color="#DCEEFA" stop-opacity="0.82" />
      <stop offset="55%" stop-color="#D4EAFA" stop-opacity="0.78" />
      <stop offset="82%" stop-color="#C8E2F6" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#BFDFF4" stop-opacity="0.65" />
    </radialGradient>

    <!-- Edge pooling tint: applied as a second layer at the perimeter -->
    <radialGradient id="edgePool" cx="50%" cy="48%" rx="54%" ry="52%">
      <stop offset="0%" stop-color="#BFDFF4" stop-opacity="0" />
      <stop offset="68%" stop-color="#BFDFF4" stop-opacity="0" />
      <stop offset="88%" stop-color="#B4D8F0" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A8D0EC" stop-opacity="0.30" />
    </radialGradient>

    <!-- Main wash filter: wobble + small feather blur -->
    <filter id="watercolour" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" seed="19" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="3" />
    </filter>

    <!-- Bristle filter: less displacement, slightly more blur so streaks are faint -->
    <filter id="bristleFade" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.035" numOctaves="3" seed="44" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="2.5" />
    </filter>

    <!-- Paper grain: very faint noise overlay -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="88" result="grain" />
      <feColorMatrix in="grain" type="saturate" values="0" result="grainBW" />
      <feBlend in="SourceGraphic" in2="grainBW" mode="multiply" />
    </filter>
  </defs>

  <!-- Main wash body: organic blob with soft feathered edges -->
  <g filter="url(#watercolour)">
    <!-- Base wash fill -->
    <path fill="url(#wash)"
      d="M 56,82
         C 128,42  248,30  390,34
         C 530,38  654,28  738,56
         C 774,74  786,128 782,218
         C 778,348 784,468 780,568
         C 776,628 752,670 706,686
         C 624,706 478,714 370,710
         C 248,704 126,710 72,686
         C 36,668 28,618 30,548
         C 34,438 26,318 32,208
         C 36,132 30,96  56,82 Z" />

    <!-- Edge pigment pooling layer -->
    <path fill="url(#edgePool)"
      d="M 56,82
         C 128,42  248,30  390,34
         C 530,38  654,28  738,56
         C 774,74  786,128 782,218
         C 778,348 784,468 780,568
         C 776,628 752,670 706,686
         C 624,706 478,714 370,710
         C 248,704 126,710 72,686
         C 36,668 28,618 30,548
         C 34,438 26,318 32,208
         C 36,132 30,96  56,82 Z" />
  </g>

  <!-- Faint dry-brush bristle streaks at outer edges only (left edge + bottom) -->
  <g filter="url(#bristleFade)">
    <!-- Left edge bristles: vertical direction, very faint -->
    <path fill="none" stroke="#B8D9F0" stroke-width="2.5" opacity="0.25"
      stroke-dasharray="40 60 30 80"
      d="M 44,140 C 38,260 42,400 36,540" />
    <path fill="none" stroke="#B0D4EC" stroke-width="2" opacity="0.20"
      stroke-dasharray="60 40 50 70"
      d="M 52,160 C 46,290 50,430 44,560" />
    <path fill="none" stroke="#BDE0F2" stroke-width="1.8" opacity="0.18"
      stroke-dasharray="50 80 30 60"
      d="M 62,180 C 56,310 60,440 54,550" />

    <!-- Bottom edge bristles: horizontal direction, very faint -->
    <path fill="none" stroke="#B8D9F0" stroke-width="2.5" opacity="0.22"
      stroke-dasharray="60 50 80 40"
      d="M 120,680 C 290,690 480,684 660,692" />
    <path fill="none" stroke="#B0D4EC" stroke-width="2" opacity="0.18"
      stroke-dasharray="40 70 60 50"
      d="M 140,670 C 310,678 500,672 680,680" />
  </g>

  <!-- Subtle paper-grain texture over the whole wash area -->
  <g filter="url(#grain)" opacity="0.06">
    <rect x="30" y="30" width="760" height="660" rx="60" fill="#8BAFC0" />
  </g>
</svg>
